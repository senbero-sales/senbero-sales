<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>開業準備ノート</title>
  <meta name="description" content="飲食店の新規開業準備をタスクで管理するアプリ">
  <meta name="theme-color" content="#d9480f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="開業準備">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="appbar">
    <div class="appbar-inner" id="appbar"></div>
  </header>

  <main id="view" class="view"></main>

  <nav class="tabbar" id="tabbar">
    <button data-action="tab" data-tab="home"><span class="ti">◎</span><span>ホーム</span></button>
    <button data-action="tab" data-tab="tasks"><span class="ti">☑</span><span>タスク</span></button>
    <button data-action="tab" data-tab="stores"><span class="ti">⌂</span><span>店舗</span></button>
    <button data-action="tab" data-tab="settings"><span class="ti">⚙</span><span>設定</span></button>
  </nav>

  <div class="sheet-backdrop" id="sheetBackdrop" data-action="sheet-close" hidden></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" hidden></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <input type="file" id="importFile" accept="application/json,.json" hidden>

  <script src="templates.js"></script>
  <script src="app.js"></script>
</body>
</html>
